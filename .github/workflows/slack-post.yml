# Post one Slack message as the A40 app's bot (release-notify/slack.mjs, chat.postMessage).
# The shared poster for the workflows that move from incoming webhooks to the bot (agent-ops,
# the digest, cost-patrol and health-patrol), one follow-up at a time:
#
#   post:
#     uses: a40-labs/.github/.github/workflows/slack-post.yml@main
#     with:
#       channel: C0123456789
#       payload_json: <a JSON object: "text" (the notification fallback), optional "blocks">
#       images_cache_key: <optional: the actions/cache key a job of the calling run saved its PNGs under>
#     secrets:
#       slack_bot_token: <secrets.A40_SLACK_BOT_TOKEN>
#
# Slack answers HTTP 200 for most refusals, so the job fails unless the answer says ok: true,
# and prints Slack's `error` and `warning`, never the token. Without a token it posts nothing,
# writes the payload to the job summary ("A40_SLACK_BOT_TOKEN not set: not posted") and passes.
# Image blocks may use `"local_file": "costs.png"` to upload a PNG and display it in place.
# Uploads need the A40 bot's files:write scope, with the same token used to post. Missing files
# and failed uploads drop those images; images still processing after retries fall back to the
# text sections. The payload's text remains the notification fallback.
#
# THE PNGS COME THROUGH THE CALLER'S ACTIONS CACHE, NOT AN ARTIFACT. The caller saves them with
# actions/cache/save at the path `${{ runner.temp }}/slack-images` (the path is part of the
# cache's identity, so it must be exactly that) under a key unique to its run, and passes the key.
# Artifacts count against the org's shared monthly Actions storage allowance, which Pingbo's iOS
# release builds spent on 2026-11-20 ("Artifact storage quota has been hit"); a repository's
# cache has its own 10 GB. The cache is the caller repository's, at the caller's ref, so a
# pull-request branch cannot plant an image for a main-branch post. A miss drops the images,
# never the post.
# A CALLER TRIGGERED BY `pull_request_target` MUST SET `cache-mode: write-only` ON THE JOB THAT
# SAVES. Since GitHub's change of 2026-06-26 such a run has a read-only cache by default: the
# save only warns ("cache write denied: token has no writable scopes"), the restore here misses,
# and the post goes out without its images (deploy's digest of 2026-11-22). A manual dispatch has
# a writable cache, so a dry run does not show it. This workflow sets no cache-mode: read access
# is enough to restore, and a called workflow may not ask for more than its caller allows.
# runs-on a40-runner for the reasons release-notify.yml gives. Callers use @main.
name: slack-post

on:
  workflow_call:
    inputs:
      channel:
        description: "The Slack channel id"
        required: true
        type: string
      payload_json:
        description: 'The message as JSON: {"text": "...", "blocks": [...]}'
        required: true
        type: string
      images_cache_key:
        description: "The actions/cache key under which the calling run saved its PNGs at runner.temp/slack-images"
        required: false
        type: string
        default: ""
    secrets:
      slack_bot_token:
        description: "The A40 app's bot token (xoxb-). Without it nothing is posted."
        required: false
    outputs:
      slack_ts:
        description: "The posted message's ts; empty when nothing was posted"
        value: ${{ jobs.post.outputs.slack_ts }}

permissions:
  contents: read

jobs:
  post:
    runs-on: a40-runner
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      slack_ts: ${{ steps.post.outputs.slack_ts }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: a40-labs/.github
          ref: ${{ startsWith(github.workflow_ref, 'a40-labs/.github/') && github.workflow_sha || 'main' }}
          path: notifier
          sparse-checkout: release-notify
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore Slack images
        if: ${{ inputs.images_cache_key != '' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          key: ${{ inputs.images_cache_key }}
          path: ${{ runner.temp }}/slack-images

      - name: Post to Slack
        id: post
        env:
          SLACK_BOT_TOKEN: ${{ secrets.slack_bot_token }}
          SLACK_PAYLOAD_JSON: ${{ inputs.payload_json }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          args=(--channel "$CHANNEL")
          if [ -d "$RUNNER_TEMP/slack-images" ]; then args+=(--images-dir "$RUNNER_TEMP/slack-images"); fi
          node "$GITHUB_WORKSPACE/notifier/release-notify/slack.mjs" "${args[@]}"
