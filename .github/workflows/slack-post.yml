# Post one Slack message as the A40 app's bot (release-notify/slack.mjs, chat.postMessage).
# The shared poster for the workflows that move from incoming webhooks to the bot (agent-ops,
# the digest, cost-patrol and health-patrol), one follow-up at a time:
#
#   post:
#     uses: a40-labs/.github/.github/workflows/slack-post.yml@main
#     with:
#       channel: C0123456789
#       payload_json: <a JSON object: "text" (the notification fallback), optional "blocks">
#     secrets:
#       slack_bot_token: <secrets.A40_SLACK_BOT_TOKEN>
#
# Slack answers HTTP 200 for most refusals, so the job fails unless the answer says ok: true,
# and prints Slack's `error` and `warning`, never the token. Without a token it posts nothing,
# writes the payload to the job summary ("A40_SLACK_BOT_TOKEN not set: not posted") and passes.
# runs-on a40-runner for the reasons release-notify.yml gives. Callers use @main.
name: slack-post

on:
  workflow_call:
    inputs:
      channel:
        description: "The Slack channel id"
        required: true
        type: string
      payload_json:
        description: 'The message as JSON: {"text": "...", "blocks": [...]}'
        required: true
        type: string
    secrets:
      slack_bot_token:
        description: "The A40 app's bot token (xoxb-). Without it nothing is posted."
        required: false
    outputs:
      slack_ts:
        description: "The posted message's ts; empty when nothing was posted"
        value: ${{ jobs.post.outputs.slack_ts }}

permissions:
  contents: read

jobs:
  post:
    runs-on: a40-runner
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      slack_ts: ${{ steps.post.outputs.slack_ts }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: a40-labs/.github
          ref: ${{ startsWith(github.workflow_ref, 'a40-labs/.github/') && github.workflow_sha || 'main' }}
          path: notifier
          sparse-checkout: release-notify
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Post to Slack
        id: post
        env:
          SLACK_BOT_TOKEN: ${{ secrets.slack_bot_token }}
          SLACK_PAYLOAD_JSON: ${{ inputs.payload_json }}
          CHANNEL: ${{ inputs.channel }}
        run: node "$GITHUB_WORKSPACE/notifier/release-notify/slack.mjs" --channel "$CHANNEL"
