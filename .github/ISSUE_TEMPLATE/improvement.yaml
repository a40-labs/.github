name: 🧹 Suggest Improvement
description: Something works, but could work better
title: "[Improvement] "
type: "Improvement"
labels: ["improvement"]

body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: What is annoying, slow, confusing, or missing today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What should it look like instead?
      description: How you imagine it working instead. A rough sketch is fine.
    validations:
      required: true

  - type: textarea
    id: measured-by
    attributes:
      label: Measured by
      description: |
        The brief for this change's measuring issue: the usage events that record it, and the number it is meant to move — adoption, a lapse (p50/p95), retention, cost per event, margin, CAC, LTV — read on admin.a40.ai/usage.
        Name the events from the usage vocabulary (pingbo docs/adr/usage-measurement/inventory.json), or the row the shipping PR will add; the number today; and the window and cohort to read it over. This issue closes on its own boxes; at release a 📈 Measuring issue is opened with this field copied in, and the production reading closes that one. Write "None: <why>" only for work no person uses, and then no measuring issue is opened.
      placeholder: |
        Events: matter_opened, draft_sent
        Moves: draft_sent adoption (12 of 23 → …), composing p50 (4 m 05 s → …)
        Read over: the first 14 days after the build ships, every account
    validations:
      required: true

  - type: textarea
    id: documents
    attributes:
      label: Documents
      description: |
        The roadmap pages and design records this touches — the architecture page on roadmap.a40.ai (/pingbo/architecture/…, /a40/…), the ADR or FEAT — and what in them changes when this ships. Closing includes those pages updated to the shipped reality; a page that still describes the old behaviour keeps the issue open. Write "None: <why>" when no page describes this area.
      placeholder: |
        roadmap.a40.ai/pingbo/architecture/usage/ — the Features view gains the new row
        pingbo docs/adr/usage-measurement/plan.md §3 — the event is added to the tracking plan
    validations:
      required: true

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else?
      description: Screenshots, links, prior art, or alternatives you considered.
    validations:
      required: false
