name: 🧹 Suggest Improvement
description: Something works, but could work better
title: "[Improvement] "
type: "Improvement"
labels: ["improvement"]

body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: What is annoying, slow, confusing, or missing today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What should it look like instead?
      description: How you imagine it working instead. A rough sketch is fine.
    validations:
      required: true

  - type: textarea
    id: measured-by
    attributes:
      label: Measured by
      description: |
        The loop this issue closes: the usage events that record it, and the number it is meant to move — adoption, a lapse (p50/p95), retention, cost per event, margin, CAC, LTV — read on admin.a40.ai/usage.
        Name the events from the usage vocabulary (pingbo docs/adr/usage-measurement/inventory.json), or the row the shipping PR will add; then the reading that closes the issue: the number, its window and its cohort. Write "None: <why>" only for work no person uses.
      placeholder: |
        Events: matter_opened, draft_sent
        Moves: draft_sent adoption (12 of 23 → …), composing p50 (4 m 05 s → …)
        Closes on: the first 14-day reading after the build ships, posted here
    validations:
      required: true

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else?
      description: Screenshots, links, prior art, or alternatives you considered.
    validations:
      required: false
